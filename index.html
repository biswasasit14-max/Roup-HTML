<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 350px;
            position: relative;
            transition: all 0.3s ease;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        #message {
            margin-top: 20px;
            text-align: center;
            min-height: 24px;
            font-weight: 500;
            padding: 10px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .success-message {
            color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .error-message {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        /* Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        
        /* Glow Effects */
        @keyframes redGlow {
            0%, 100% { box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 20px 60px rgba(239, 68, 68, 0.4), 0 0 30px rgba(239, 68, 68, 0.3); }
        }
        
        @keyframes greenGlow {
            0%, 100% { box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 20px 60px rgba(16, 185, 129, 0.4), 0 0 30px rgba(16, 185, 129, 0.3); }
        }
        
        .error-glow {
            animation: redGlow 1s ease-in-out;
        }
        
        .success-glow {
            animation: greenGlow 2s ease-in-out;
        }
        
        /* Input error state */
        .input-error {
            border-color: #ef4444 !important;
            animation: inputError 0.5s ease-in-out;
        }
        
        @keyframes inputError {
            0%, 100% { border-color: #ef4444; }
            50% { border-color: #fca5a5; }
        }
        
        /* Loading animation */
        .loading {
            position: relative;
            color: transparent !important;
        }
        
        .loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin: -10px 0 0 -10px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .fade-out {
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <h2>🔐 Secure Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">👤 Username:</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label for="password">🔒 Password:</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Enter your password">
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <div id="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
