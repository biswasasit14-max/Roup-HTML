<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Directory</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 20%;
      background: #f4f4f4;
      border-right: 1px solid #ccc;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Animated conic gradient header */
    .sidebar-header {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 20px;
      padding: 10px 20px;
      border: 6px solid transparent;
      border-radius: 12px;
      background: conic-gradient(
        from 0deg,
        red,
        orange,
        yellow,
        green,
        blue,
        indigo,
        violet,
        red
      );
      background-size: 200% 200%;
      animation: rotateGradient 5s linear infinite;
      color: black;
      text-align: center;
    }

    @keyframes rotateGradient {
      0% {
        background: conic-gradient(
          from 0deg,
          red,
          orange,
          yellow,
          green,
          blue,
          indigo,
          violet,
          red
        );
      }
      100% {
        background: conic-gradient(
          from 360deg,
          red,
          orange,
          yellow,
          green,
          blue,
          indigo,
          violet,
          red
        );
      }
    }

    .sidebar a {
      display: block;
      padding: 10px;
      margin: 5px 0;
      text-decoration: none;
      color: black;
      background-color: grey;
      transition: all 0.2s ease;
      width: 100%;
      text-align: center;
      border-radius: 6px;
    }

    .sidebar a:hover {
      background-color: lightgrey;
      transform: translateX(2px);
    }

    .sidebar a.active {
      background-color: green;
      color: white;
      transform: translateX(5px);
    }

    /* Content frame */
    .content {
      width: 80%;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Circular reset button */
    .reset-btn {
      margin-top: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #d9534f;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .reset-btn:hover {
      background: #c9302c;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">Directory</div>
    <a href="Home.html" target="contentFrame">Home</a>
    <a href="About Us.html" target="contentFrame">About Us</a>
    <a href="Departments.html" target="contentFrame">Departments</a>
    <button class="reset-btn" onclick="resetFrame()">↺</button>
  </div>

  <div class="content">
    <iframe name="contentFrame" id="contentFrame"></iframe>
  </div>

  <script>
    const links = document.querySelectorAll('.sidebar a');
    const iframe = document.getElementById('contentFrame');

    // Add click event to links
    links.forEach(link => {
      link.addEventListener('click', function() {
        links.forEach(l => l.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Reset iframe
    function resetFrame() {
      iframe.srcdoc = "<h2 style='text-align:center; margin-top:20%;'>Click a link from the directory to view content here.</h2>";
      links.forEach(l => l.classList.remove('active'));
    }

    // Initialize with reset text
    resetFrame();
  </script>
</body>
</html>
